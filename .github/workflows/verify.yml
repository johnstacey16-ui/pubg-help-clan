name: Verify PUBG bot

on:
  push:
    branches: [main, development]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install endpoint dependencies for tests
        run: npm install --no-save --ignore-scripts --no-audit --no-fund
      - name: Check JavaScript syntax
        run: find api lib assets scripts tests -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Test game-mode maths and account names
        run: node --test tests/*.test.js

  chromium-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install lightweight Chrome driver
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.57.0
      - name: Confirm hosted Google Chrome
        run: command -v google-chrome && google-chrome --version
      - name: Verify real Chrome at desktop and mobile viewports with synthetic data
        run: node tests/browser-smoke.js
      - name: Verify complete player stats in the actual dashboard on Chrome
        run: node tests/full-stats-browser-smoke.js
      - name: Verify the merged HELP toolkit and namespaced assets in real Chrome
        run: node tests/training-merged-smoke.js
      - name: Verify all 13 hit zones and mannequin at five screen widths
        run: node training/tests/hit-zone-preview-smoke.cjs

  production-static-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[deploy]')
    needs: chromium-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check real production static pages and HELP toolkit assets
        run: node tests/production-http-smoke.js

