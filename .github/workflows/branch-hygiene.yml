name: Prune proven merged branches

on:
  push:
    branches: [development]
    paths:
      - .github/workflows/branch-hygiene.yml
  pull_request:
    types: [closed]
    branches: [main, development]
  workflow_dispatch:
    inputs:
      apply:
        description: Delete verified merged branches (unchecked = dry run)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prune:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      APPLY: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || inputs.apply == true }}
      ONLY_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || '' }}
    steps:
      - name: Delete only verified merged and unmodified PR head branches
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';

          const repository = process.env.GITHUB_REPOSITORY;
          const token = process.env.GH_TOKEN;
          const apply = process.env.APPLY === 'true';
          const onlyBranch = process.env.ONLY_BRANCH || '';
          const kept = ['main', 'development'];
          if (!repository || !token) throw new Error('GitHub repository/token missing');
          const request = async (method, route) => {
            const response = await fetch('https://api.github.com/repos/' + repository + route, {
              method,
              headers: {
                Authorization: 'Bearer ' + token,
                Accept: 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28',
                'User-Agent': 'branch-hygiene'
              }
            });
            const body = await response.text();
            if (!response.ok) throw new Error(method + ' ' + route + ': ' + response.status + ' ' + body.slice(0, 160));
            return body ? JSON.parse(body) : null;
          };
          const paged = async route => {
            const result = [];
            for (let page = 1; page <= 20; page++) {
              const sep = route.includes('?') ? '&' : '?';
              const part = await request('GET', route + sep + 'per_page=100&page=' + page);
              if (!Array.isArray(part)) throw new Error('Expected array from ' + route);
              result.push(...part);
              if (part.length < 100) return result;
            }
            throw new Error('Pagination exceeded safe page limit for ' + route);
          };
          const branches = await paged('/branches');
          const prs = await paged('/pulls?state=all');
          const active = new Set(prs.filter(p => p.state === 'open' && p.head?.repo?.full_name === repository)
            .map(p => p.head.ref));
          const deleted = [], skipped = [];
          for (const branch of branches) {
            const name = branch.name;
            if (kept.includes(name) || branch.protected || (onlyBranch && name !== onlyBranch)) continue;
            if (active.has(name)) { skipped.push(name + ': active PR'); continue; }
            const merged = prs.find(p => p.merged_at && p.merge_commit_sha &&
              p.head?.repo?.full_name === repository && p.head.ref === name &&
              p.head.sha === branch.commit.sha && ['main', 'development'].includes(p.base.ref));
            if (!merged) { skipped.push(name + ': no exact merged PR head'); continue; }
            try {
              const comparison = await request('GET', '/compare/' +
                encodeURIComponent(merged.merge_commit_sha) + '...' + encodeURIComponent(merged.base.ref));
              if (!['ahead', 'identical'].includes(comparison.status)) {
                skipped.push(name + ': merge commit not in ' + merged.base.ref); continue;
              }
              const refPath = '/git/refs/heads/' + name.split('/').map(encodeURIComponent).join('/');
              const current = await request('GET', refPath.replace('/refs/', '/ref/'));
              if (current.object?.sha !== branch.commit.sha) {
                skipped.push(name + ': branch changed after audit'); continue;
              }
              if (apply) await request('DELETE', refPath);
              deleted.push(name);
              console.log((apply ? 'DELETED ' : 'WOULD DELETE ') + name + ' (merged PR #' + merged.number + ')');
            } catch (error) {
              skipped.push(name + ': ' + String(error.message).slice(0, 120));
            }
          }
          const summary = '## Branch hygiene\n\n' +
            '- Mode: **' + (apply ? 'apply' : 'dry run') + '**\n' +
            '- Verified ' + (apply ? 'deleted' : 'candidates') + ': **' + deleted.length + '**\n' +
            '- Retained for review: **' + skipped.length + '**\n\n' +
            '### ' + (apply ? 'Deleted' : 'Candidates') + '\n' +
            (deleted.map(n => '- `' + n + '`').join('\n') || 'None') + '\n\n' +
            '### Retained (not proven safe)\n' +
            (skipped.map(n => '- ' + n.replaceAll('|', '/')).join('\n') || 'None') + '\n';
          if (process.env.GITHUB_STEP_SUMMARY) appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          console.log(summary);
          NODE
